{% extends 'base.html' %}
{% block title %}登录 · Speak 聊天室{% endblock %}
{% block content %}
  <section class="card">
    <h1>登录</h1>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus
             autocomplete="username" maxlength="20" value="{{ username or '' }}">

      <label for="password">密码</label>
      <input type="password" id="password" name="password" required
             autocomplete="current-password">

      {% if turnstile_site_key %}
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"
             data-language="zh-cn" data-theme="light"></div>
      {% endif %}

      <button type="submit" class="button primary">登录</button>
    </form>
    <p class="muted">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
  </section>
{% endblock %}

{% block scripts %}
  {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {% endif %}
{% endblock %}
