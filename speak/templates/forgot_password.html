{% extends 'base.html' %}
{% block title %}找回密码 · {{ site_name }}{% endblock %}
{% block content %}
  <section class="card card--form">
    <h1>找回密码</h1>
    <p class="muted">
      填写注册时使用的邮箱，我们会发送一封包含重置链接的邮件。
    </p>

    <form method="post" action="{{ url_for('auth.forgot_password') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="email">邮箱</label>
      <input type="email" id="email" name="email" required autofocus
             autocomplete="email" maxlength="254" value="{{ email or '' }}">

      {% if turnstile_site_key %}
        <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"
             data-language="zh-cn" data-theme="light"></div>
      {% endif %}

      <button type="submit" class="button primary">发送重置邮件</button>
    </form>

    <p class="muted">想起来了？<a href="{{ url_for('auth.login') }}">返回登录</a></p>
  </section>
{% endblock %}

{% block scripts %}
  {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="{{ url_for('static', filename='turnstile-status.js') }}" defer></script>
  {% endif %}
{% endblock %}
