{% extends 'base.html' %}
{% block title %}重置密码 · {{ site_name }}{% endblock %}
{% block content %}
  <section class="card card--form">
    <h1>重置密码</h1>
    <p class="muted">正在为账号 <b>{{ username }}</b> 设置新密码。</p>

    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="password">新密码</label>
      <input type="password" id="password" name="password" required autofocus
             autocomplete="new-password" minlength="8" maxlength="128">
      <p class="hint">至少 8 个字符。</p>

      <label for="password2">确认新密码</label>
      <input type="password" id="password2" name="password2" required
             autocomplete="new-password" minlength="8" maxlength="128">

      <button type="submit" class="button primary">设置新密码</button>
    </form>

    <p class="muted">链接失效了？<a href="{{ url_for('auth.forgot_password') }}">重新申请</a></p>
  </section>
{% endblock %}
